crons:
  - name: asset-service-alerts
    description: "Daily 9am IST WhatsApp reminders for assets whose service is due or overdue"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/asset-alerts"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
